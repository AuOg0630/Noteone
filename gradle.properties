# 构建内存与编码
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true

# AGP 9 默认开启新的 public DSL 与内置 Kotlin 支持，但 KSP 与二者都不兼容
# （KSP 会直接报 "KSP is not compatible with Android Gradle Plugin's built-in Kotlin"）。
# 因此本项目显式关闭这两项，继续使用 Kotlin Gradle Plugin + KSP 的经典组合。
# 待 KSP 支持新 DSL 后可移除这两行。
android.newDsl=false
android.builtInKotlin=false

# 上面两行会触发 AGP 的兼容性提示，这里显式压制，避免淹没真正的编译警告。
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL

kotlin.code.style=official
